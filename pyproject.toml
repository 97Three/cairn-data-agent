[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cairn-data-agent"
version = "0.1.0"
description = "Teaching-first, evidence-grounded data agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "fastexcel>=0.17,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "polars>=1.30,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
cairn-data-agent = "cairn_data_agent.api:run"
cairn-data-agent-demo = "cairn_data_agent.demo:main"

[project.urls]
Repository = "https://github.com/97Three/cairn-data-agent"
Documentation = "https://github.com/97Three/cairn-data-agent#readme"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
  "xlsxwriter>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_data_agent"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "cairn_data_agent/_bundled/contracts"
"examples" = "cairn_data_agent/_bundled/examples"
"scenarios" = "cairn_data_agent/_bundled/scenarios"
"skills" = "cairn_data_agent/_bundled/skills"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fastexcel", "fastexcel.*", "polars", "polars.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cairn_data_agent"]
omit = ["src/cairn_data_agent/demo.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
